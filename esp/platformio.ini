; PlatformIO Project Configuration File for ESP32-S3 Edge Air Quality Monitor
; Target Hardware: ESP32-S3-WROOM-1 / N16R8 (16MB Quad SPI Flash, 8MB Octal SPI PSRAM)
; Architecture: Dual Xtensa LX7 @ 240MHz, 0-Heap TinyML Edge Engine
; Locked Pinout: board_pins.h (Strict Octal PSRAM Isolation on GPIO33..37)

[platformio]
src_dir = src
include_dir = include
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Clock & Performance Settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Memory Layout: 16MB Flash + 8MB Octal PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize

; Build Flags: Optimization, PSRAM, C++17 Standard
build_flags =
    -std=gnu++17
    -O3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -Iinclude

; Library Dependencies (Embedded native frameworks Wire, SPI, HardwareSerial included)
lib_deps =
